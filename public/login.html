<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - IGRID Innovation Lab PM Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Google OAuth Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-main, #0b0f19);
      font-family: 'Inter', system-ui, sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background blobs */
    .bg-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.35;
      pointer-events: none;
    }
    .blob-1 {
      top: 10%;
      left: 15%;
      width: 320px;
      height: 320px;
      background: #f59e0b;
    }
    .blob-2 {
      bottom: 15%;
      right: 15%;
      width: 380px;
      height: 380px;
      background: #6366f1;
    }

    .auth-card-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    .auth-card {
      background: var(--bg-card, rgba(15, 23, 42, 0.85));
      border: 1px solid var(--border-color, rgba(255, 255, 255, 0.12));
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    .brand-logo-img {
      height: 48px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
    }

    .auth-brand h1 {
      margin: 0 0 6px 0;
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main, #f8fafc);
    }

    .auth-brand p {
      margin: 0;
      font-size: 13px;
      color: var(--text-dim, #94a3b8);
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 24px;
      gap: 4px;
    }

    .auth-tab {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-dim, #94a3b8);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .auth-tab.active {
      background: var(--primary, #f59e0b);
      color: #000000;
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim, #94a3b8);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color, rgba(255, 255, 255, 0.15));
      background: rgba(0, 0, 0, 0.25);
      color: var(--text-main, #f8fafc);
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary, #f59e0b);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--primary, #f59e0b);
      color: #000000;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
      margin-top: 6px;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      background: #d97706;
    }

    .forgot-link-wrap {
      text-align: right;
      margin-top: 6px;
    }

    .forgot-link {
      color: var(--primary, #f59e0b);
      font-size: 12px;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* Toast Notification */
    .auth-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      display: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <!-- Ambient Blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="auth-card-container">
    <div class="auth-card">
      
      <!-- Brand Header -->
      <div class="auth-brand">
        <div class="brand-logos">
          <img src="https://igridlab.com/assets/img/logo.png" alt="IGRID Lab Logo" class="brand-logo-img" onerror="this.src='/favicon.ico';">
        </div>
        <h1>IGRID Innovation Lab</h1>
        <p>Project Management & Team Monitoring Dashboard</p>
      </div>

      <!-- Auth Navigation Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login">Sign In</button>
        <button class="auth-tab" id="tab-signup">Create Account</button>
      </div>

      <!-- 1. SIGN IN FORM -->
      <form id="form-login">
        <!-- Gmail Google OAuth Sign-in Button -->
        <div style="display:flex; justify-content:center; margin-bottom:14px;">
          <div id="g_id_onload"
               data-client_id="845239102834-igridlab.apps.googleusercontent.com"
               data-context="signin"
               data-ux_mode="popup"
               data-callback="handleGoogleSignIn"
               data-auto_prompt="false">
          </div>
          <div class="g_id_signin"
               data-type="standard"
               data-shape="rectangular"
               data-theme="filled_dark"
               data-text="signin_with"
               data-size="large"
               data-logo_alignment="left"
               data-width="360">
          </div>
        </div>

        <div style="display:flex; align-items:center; text-align:center; margin:16px 0; color:var(--text-dim,#64748b); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px;">
          <span style="flex:1; border-bottom:1px solid rgba(255,255,255,0.1);"></span>
          <span style="padding:0 10px;">Or Sign In with Email</span>
          <span style="flex:1; border-bottom:1px solid rgba(255,255,255,0.1);"></span>
        </div>

        <div class="form-group">
          <label>Gmail / Email Address</label>
          <input type="email" id="login-email" placeholder="name@gmail.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
          <div class="forgot-link-wrap">
            <span class="forgot-link" id="link-forgot">Forgot Password?</span>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-login-submit">Sign In to Dashboard</button>
      </form>

      <!-- 2. CREATE ACCOUNT FORM -->
      <form id="form-signup" style="display: none;">
        <div class="form-group">
          <label>Gmail / Email Address</label>
          <input type="email" id="signup-email" placeholder="student@gmail.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label>Create Password (encrypted)</label>
          <input type="password" id="signup-password" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="signup-confirm-password" placeholder="Re-enter password" minlength="6" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn-submit" id="btn-signup-submit">Register Account</button>
      </form>

      <!-- 3. FORGOT PASSWORD FORM -->
      <form id="form-forgot" style="display: none;">
        <div style="text-align: center; margin-bottom: 18px;">
          <h3 style="margin: 0 0 6px 0; font-size: 16px; color: var(--text-main);">Reset Your Password</h3>
          <p style="margin: 0; font-size: 12px; color: var(--text-dim);">Enter your email address and we'll generate a secure password reset link.</p>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="forgot-email" placeholder="name@gmail.com" required autocomplete="email">
        </div>

        <button type="submit" class="btn-submit" id="btn-forgot-submit">Send Reset Link</button>
        <div style="text-align: center; margin-top: 14px;">
          <span class="forgot-link" id="link-back-to-login">← Back to Sign In</span>
        </div>
      </form>

    </div>
  </div>

  <!-- Toast Notification -->
  <div class="auth-toast" id="auth-toast"></div>

  <script>
    // Tab Elements
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const formLogin = document.getElementById('form-login');
    const formSignup = document.getElementById('form-signup');
    const formForgot = document.getElementById('form-forgot');
    const linkForgot = document.getElementById('link-forgot');
    const linkBackToLogin = document.getElementById('link-back-to-login');
    const toast = document.getElementById('auth-toast');

    function showToast(msg, isError = false) {
      toast.textContent = msg;
      toast.style.background = isError ? '#ef4444' : '#10b981';
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    tabLogin.onclick = () => {
      tabLogin.classList.add('active'); tabSignup.classList.remove('active');
      formLogin.style.display = 'block'; formSignup.style.display = 'none'; formForgot.style.display = 'none';
    };

    tabSignup.onclick = () => {
      tabSignup.classList.add('active'); tabLogin.classList.remove('active');
      formSignup.style.display = 'block'; formLogin.style.display = 'none'; formForgot.style.display = 'none';
    };

    linkForgot.onclick = () => {
      formLogin.style.display = 'none'; formSignup.style.display = 'none'; formForgot.style.display = 'block';
    };

    // Google Sign-In Callback Handler
    window.handleGoogleSignIn = async function(response) {
      try {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: payload.email, google_id: payload.sub, credential: response.credential })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('igrid_session', data.token);
          showToast('Google Sign-in Successful! Redirecting...');
          setTimeout(() => { window.location.href = `/?token=${data.token}`; }, 800);
        } else {
          showToast(data.error || 'Google Sign-in failed', true);
        }
      } catch (err) {
        showToast('Google Sign-in failed', true);
      }
    };

    // Form Submissions
    formLogin.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('igrid_session', data.token);
          showToast('Welcome back! Redirecting to dashboard...');
          setTimeout(() => { window.location.href = `/?token=${data.token}`; }, 600);
        } else {
          showToast(data.error || 'Login failed', true);
        }
      } catch (err) {
        showToast('Connection error', true);
      }
    };

    formSignup.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirmPassword = document.getElementById('signup-confirm-password').value;

      if (password !== confirmPassword) {
        showToast('Passwords do not match', true);
        return;
      }

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('igrid_session', data.token);
          showToast('Account registered! Redirecting to dashboard...');
          setTimeout(() => { window.location.href = `/?token=${data.token}`; }, 600);
        } else {
          showToast(data.error || 'Registration failed', true);
        }
      } catch (err) {
        showToast('Connection error', true);
      }
    };

    formForgot.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value.trim();

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (res.ok) {
          showToast(data.message);
          if (data.reset_url) {
            alert(`[SIMULATED RESET EMAIL]\nPassword Reset Link generated:\n${window.location.origin}${data.reset_url}`);
          }
        } else {
          showToast(data.error || 'Failed to request reset', true);
        }
      } catch (err) {
        showToast('Connection error', true);
      }
    };

    // Check if reset token in URL
    const urlParams = new URLSearchParams(window.location.search);
    const resetToken = urlParams.get('reset_token');
    if (resetToken) {
      const newPassword = prompt('Enter your new password (at least 6 characters):');
      if (newPassword) {
        fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reset_token: resetToken, new_password: newPassword })
        }).then(r => r.json()).then(data => {
          if (data.message) {
            showToast(data.message);
          } else {
            showToast(data.error || 'Reset failed', true);
          }
        });
      }
    }
  </script>
</body>
</html>

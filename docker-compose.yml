version: '3.8'

services:
  igrid-pm-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: igrid-pm-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persistent SQLite database storage on host machine
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/projects"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
